plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.padcombo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.padcombo'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            // Debug build ships with the default debug signature, so the GitHub
            // Actions artifact can be installed directly after allowing unknown
            // sources. No keystore needed.
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
