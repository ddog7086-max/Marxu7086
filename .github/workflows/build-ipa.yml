name: build-ipa
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          ZIP=$(find . -name "PadCombo-ios.zip" | head -1)
          echo "zip found at: $ZIP"
          unzip -o "$ZIP" -d unpacked
          ls -la unpacked
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd unpacked && xcodegen generate
      - name: Build unsigned app
        run: |
          cd unpacked
          xcodebuild -project PadCombo.xcodeproj -scheme PadCombo -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package ipa
        run: |
          mkdir -p out/Payload
          cp -R unpacked/build/Build/Products/Release-iphoneos/PadCombo.app out/Payload/
          cd out && zip -r PadCombo.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PadCombo-ipa
          path: out/PadCombo.ipa
